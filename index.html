<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton S70 — Service & Mileage Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-full bg-slate-950 text-slate-100 flex flex-col">

    <!-- APP HEADER -->
    <header class="h-14 border-b border-slate-900 bg-[#090d16] px-4 flex items-center justify-between sticky top-0 z-30">
        <div>
            <h1 class="text-xs font-black tracking-wider text-white uppercase">PROTON S70 TRACKER</h1>
            <p id="sync-status" class="text-[9px] font-medium text-emerald-400 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Local Mode
            </p>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="openSettingsModal()" title="Settings & History" class="bg-[#0b101d] hover:bg-slate-800 border border-slate-800 text-slate-300 text-[11px] font-bold px-2.5 py-1.5 rounded-xl transition-all">
                <i class="fa-solid fa-gear text-amber-400"></i>
            </button>
            <button onclick="openSheetSetupModal()" title="Sync" class="bg-[#0b101d] hover:bg-slate-800 border border-slate-800 text-slate-300 text-[11px] font-bold px-2.5 py-1.5 rounded-xl transition-all">
                <i class="fa-solid fa-cloud-arrow-up text-sky-400"></i>
            </button>
            <button onclick="openLogModal()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-[11px] px-3.5 py-1.5 rounded-xl shadow-md transition-all uppercase tracking-wider flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> Log
            </button>
        </div>
    </header>

    <!-- MAIN DASHBOARD -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-5 space-y-4">

        <!-- CARD 1: MILEAGE UPDATE -->
        <div class="bg-[#080d1a] border border-slate-800/80 rounded-2xl overflow-hidden shadow-md">
            <div class="px-4 py-3 border-b border-slate-800/80 bg-[#050913]">
                <div class="flex items-center gap-2 text-xs font-black tracking-wider text-white uppercase">
                    <i class="fa-solid fa-gauge text-sky-400"></i> Mileage Update
                </div>
            </div>

            <div class="divide-y divide-slate-800/60 text-xs">
                <div class="px-4 py-2.5 flex items-center justify-between">
                    <span class="text-slate-400 font-medium">Date</span>
                    <span id="row-date" class="font-mono font-bold text-slate-200">1 Nov 2026</span>
                </div>
                <div class="px-4 py-2.5 flex items-center justify-between">
                    <span class="text-slate-400 font-medium">Current Odometer</span>
                    <div class="flex items-center gap-2 font-mono">
                        <span id="row-current-odo" class="font-black text-white">45,591 km</span>
                        <span id="row-daily-delta" class="text-[11px] font-bold text-emerald-400">(+511 km)</span>
                    </div>
                </div>
                <div class="px-4 py-2.5 flex items-center justify-between">
                    <span class="text-slate-400 font-medium">Latest Oil Service</span>
                    <span id="row-last-oil" class="font-mono text-slate-300">42,744 km — 23 Sep 2026</span>
                </div>
                <div class="px-4 py-2.5 flex items-center justify-between">
                    <span class="text-slate-400 font-medium">Oil Used</span>
                    <span id="row-oil-used" class="font-mono text-slate-300">2,847 km (39 days ago)</span>
                </div>
                <div class="px-4 py-3 space-y-2 bg-[#060a15]/50">
                    <div class="flex items-center justify-between">
                        <span class="text-slate-300 font-bold">Remaining to Oil Service</span>
                        <span id="row-oil-remaining" class="font-mono font-black text-amber-400 text-sm">4,653/7,500 km</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-800">
                        <div id="kpi-oil-bar" class="bg-amber-400 h-2 rounded-full transition-all duration-500" style="width: 38%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- INCOMING MAINTENANCE -->
        <div class="bg-[#080d1a] border border-slate-800/80 rounded-2xl overflow-hidden shadow-md">
            <button onclick="toggleCard('card-incoming')" class="w-full px-4 py-3 border-b border-slate-800/80 bg-[#050913] flex items-center justify-between text-left hover:bg-slate-900/40 transition-colors">
                <h2 class="text-xs font-black tracking-wider text-white uppercase flex items-center gap-2">
                    <i class="fa-solid fa-calendar-star text-emerald-400"></i> Incoming Maintenance
                </h2>
                <i id="icon-card-incoming" class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-200" style="transform: rotate(-90deg);"></i>
            </button>
            <div id="content-card-incoming" class="p-4 space-y-2 font-mono hidden"></div>
        </div>

        <!-- ENGINE OIL REALISTIC -->
        <div class="bg-[#080d1a] border border-slate-800/80 rounded-2xl overflow-hidden shadow-md">
            <button onclick="toggleCard('card-oil-real')" class="w-full px-4 py-3 border-b border-slate-800/80 bg-[#050913] flex items-center justify-between text-left hover:bg-slate-900/40 transition-colors">
                <h2 class="text-xs font-black tracking-wider text-white uppercase flex items-center gap-2">
                    <i class="fa-solid fa-wrench text-sky-400"></i> Engine Oil Service (Realistic Pace)
                </h2>
                <i id="icon-card-oil-real" class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-200"></i>
            </button>
            <div id="content-card-oil-real" class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800/80 text-[10px] font-extrabold text-slate-400 uppercase bg-[#050913]/50">
                            <th class="py-2.5 px-4">Target Mileage</th>
                            <th class="py-2.5 px-4">Realistic Date</th>
                        </tr>
                    </thead>
                    <tbody id="oil-realistic-body" class="divide-y divide-slate-800/50 text-xs font-mono"></tbody>
                </table>
            </div>
        </div>

        <!-- OTHER MAINTENANCE REALISTIC -->
        <div class="bg-[#080d1a] border border-slate-800/80 rounded-2xl overflow-hidden shadow-md">
            <button onclick="toggleCard('card-maint-real')" class="w-full px-4 py-3 border-b border-slate-800/80 bg-[#050913] flex items-center justify-between text-left hover:bg-slate-900/40 transition-colors">
                <h2 class="text-xs font-black tracking-wider text-white uppercase flex items-center gap-2">
                    <i class="fa-solid fa-screwdriver-wrench text-amber-400"></i> Other Maintenance (Realistic Pace)
                </h2>
                <i id="icon-card-maint-real" class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-200"></i>
            </button>
            <div id="content-card-maint-real" class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800/80 text-[10px] font-extrabold text-slate-400 uppercase bg-[#050913]/50">
                            <th class="py-2.5 px-3">Target Odo</th>
                            <th class="py-2.5 px-3">Realistic Date</th>
                            <th class="py-2.5 px-3">Notes / Purposes</th>
                            <th class="py-2.5 px-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="milestones-realistic-body" class="divide-y divide-slate-800/50 text-xs"></tbody>
                </table>
            </div>
        </div>

        <!-- TIME-BASED MAINTENANCE -->
        <div class="bg-[#080d1a] border border-slate-800/80 rounded-2xl overflow-hidden shadow-md">
            <button onclick="toggleCard('card-time-maint')" class="w-full px-4 py-3 border-b border-slate-800/80 bg-[#050913] flex items-center justify-between text-left hover:bg-slate-900/40 transition-colors">
                <h2 class="text-xs font-black tracking-wider text-white uppercase flex items-center gap-2">
                    <i class="fa-solid fa-clock text-emerald-400"></i> Time-Based Maintenance
                </h2>
                <i id="icon-card-time-maint" class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-200" style="transform: rotate(-90deg);"></i>
            </button>
            <div id="content-card-time-maint" class="p-4 space-y-2.5 text-xs font-mono hidden">
                <div id="time-maint-list" class="space-y-2"></div>
            </div>
        </div>

        <!-- PACE DETAILS -->
        <div class="bg-[#080d1a] border border-slate-800/80 rounded-2xl overflow-hidden shadow-md">
            <button onclick="toggleCard('card-pace')" class="w-full px-4 py-3 border-b border-slate-800/80 bg-[#050913] flex items-center justify-between text-left hover:bg-slate-900/40 transition-colors">
                <h2 class="text-xs font-black tracking-wider text-white uppercase flex items-center gap-2">
                    <i class="fa-solid fa-tachometer-alt text-purple-400"></i> Realistic Pace — V3
                </h2>
                <i id="icon-card-pace" class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-200" style="transform: rotate(-90deg);"></i>
            </button>
            <div id="content-card-pace" class="p-4 space-y-2 text-xs hidden">
                <div class="flex justify-between
